name: chat

# Superficie de conversa (minuta 0002, card 447 — fatia A): homeserver Matrix, banco
# proprio e Application Service registrado. O que esta stack NAO faz e tao importante
# quanto o que faz: nao fala com pf:msg (o chat e superficie, a malha continua sendo a
# do motor — arq:0036) e nao tem comportamento de cadeira nenhum, que e o card 448.
#
# Segredo nao mora aqui. Os tres servicos leem do cofre (~/AI/var/secrets/matrix), por
# arquivo montado :ro ou por .env fora do git, e quem cunha e o `prepara.sh` ao lado.

services:
  # Banco proprio da stack, padrao ja vigente no host (identidade, keycloak,
  # mdm-rh, motor e rag tem o seu). Sem porta publicada: quem fala com ele e o Synapse,
  # pela rede interna, e a rotacao do card 449 entra pela Admin API — nunca por aqui.
  chat-pg:
    image: postgres:16
    container_name: chat-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${PG_PASSWORD:?defina PG_PASSWORD no .env — sai do cofre por ./prepara.sh}
      # O Synapse RECUSA subir contra banco que nao seja C/C e manda usar
      # `allow_unsafe_locale` para ignorar. O locale se decide no initdb e nao se muda
      # depois sem dump/restore: errar aqui custa recriar o volume.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [interna]

  chat-synapse:
    image: ghcr.io/element-hq/synapse:v1.157.2
    container_name: chat-synapse
    restart: unless-stopped
    # Entrypoint proprio: o /start.py da imagem passa UM --config-path, e aqui a config
    # vem em dois pedacos — o versionado (sem segredo) e o gerado no cofre. O `-c` do
    # Synapse aceita repeticao, entao a divisao nao custa nada. Atencao ao merge: ele e
    # `dict.update` de chave de topo, NAO fusao profunda — por isso o bloco `database`
    # inteiro mora no gerado, e nao metade em cada arquivo.
    entrypoint: ["python", "-m", "synapse.app.homeserver"]
    command: ["-c", "/config/homeserver.yaml", "-c", "/segredos/segredos.yaml"]
    # rootless: root-do-container = claudinho no host, e e o unico uid que le arquivo 600
    # do cofre. Mesmo motivo ja escrito no core para o cloudflared (a imagem roda 991).
    user: "0:0"
    volumes:
      # DIRETORIO, nao arquivo: bind de arquivo unico nao acompanha `git checkout` — o
      # checkout troca o inode e o mount fica preso ao velho. Armadilha ja paga no host.
      - ./conf:/config:ro
      - ${HOME}/AI/var/secrets/matrix:/segredos:ro
      - dados:/data
    healthcheck:
      # Exercita o caminho que a borda vai usar, nao a porta: Synapse de pe com o recurso
      # client fora do ar reprova aqui. A imagem nao tem curl; python e o que ha.
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8008/_matrix/client/versions',timeout=8).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      chat-pg:
        condition: service_healthy
    # `interna` e onde vivem banco e AS — e por onde a Admin API responde, que e o
    # requisito do card. `conhecimento` e a rede do cloudflared: em rootless o container
    # nao alcanca o loopback do host, entao estar nela e a UNICA forma de a borda chegar
    # aqui. Ela tambem da o egresso que o OIDC precisa para falar com auth.platafirma.org.
    networks: [interna, conhecimento]

  # Receptor — o lado MATRIX do giro (card 458). Aceita a transacao, deduplica,
  # enfileira no journal, liga o typing, baixa anexo, formata, fatia e envia a
  # resposta. Ele NAO chama verbo: quem faz isso e o worker, no host, sob
  # systemd --user (chat/systemd/chat-worker.service).
  #
  # A partida e por DIRECAO, decidida por claudinho-TI (comentario 302 do card
  # 458), e as duas razoes sao medidas:
  #   - em docker rootless o container NAO alcanca o host (host-gateway, 10.0.2.2
  #     e o gateway da bridge, os tres mudos — ja pago em controle/compose.yaml);
  #   - publicar a porta do Synapse no loopback para o worker falar com ele poria
  #     a Admin API fora da rede interna, contra arq:0026.
  # Partindo assim: nenhuma porta nova, nenhuma travessia, e a UNICA fronteira e
  # o journal SQLite em WAL, no bind mount abaixo.
  chat-recepcao:
    build:
      # Contexto e chat/, nao chat/recepcao/: `comum/journal.py` e compartilhado
      # com o worker do host e entra na imagem sem virar segunda copia.
      context: .
      dockerfile: recepcao/Dockerfile
    image: platafirma/chat-recepcao:local
    container_name: chat-recepcao
    restart: unless-stopped
    # rootless: root-do-container = claudinho no host, e e o unico uid que escreve
    # nos bind mounts abaixo (~/AI e do claudinho). Mesmo motivo ja escrito para o
    # chat-synapse. O uid 10001 da imagem cairia num subuid sem acesso a nada.
    user: "0:0"
    environment:
      AS_ID: pf
      AS_SERVIDOR: http://chat-synapse:8008
      AS_DOMINIO: chat.platafirma.org
      AS_BOT: _pf
      AS_PORTA: "8080"
      AS_TOKEN: ${AS_TOKEN:?defina AS_TOKEN no .env — sai do cofre por ./prepara.sh}
      HS_TOKEN: ${HS_TOKEN:?defina HS_TOKEN no .env — sai do cofre por ./prepara.sh}
      # comum/cadeiras.py le o ledger registro/eventos-org.jsonl para o case/prefixo
      # de cada cadeira (TI e IA maiusculas), e abertura/<x>/persona.md para a persona
      # de participante — nao se calcula, se le da fonte (arq:0073).
      PF_RAIZ: /home/claudinho/AI
      CHAT_JOURNAL: /home/claudinho/AI/var/run/chat/journal.db
      CHAT_FITAS_RAIZ: /home/claudinho/AI/fitas
      # Gatilho de idade DESARMADO, por decisao do dono em 15/08 (card 449): ele
      # nao quer que a fita morra sozinha. Sala parada nao custa nada na maquina
      # dele, e "isto aqui e de ontem" ele reconhece sem ajuda; o que a rotacao
      # automatica ja custou, uma vez, foi abrir fita com a mesa pela metade.
      # Fechamento segue existindo e segue sendo dele: a palavra `zerar`.
      #
      # `inf` e desarme, nao janela grande: `vencida()` compara com >=, e nada e
      # >= infinito. NAO troque por 0 achando que desliga — 0 faz TODA mensagem
      # rodar a sala, que e o oposto. O desligamento honesto (tirar o gatilho do
      # codigo e o eco junto com ele) tem card proprio; isto aqui e o desarme de
      # hoje, para a sala do dono nao rodar amanha as 11:37.
      CHAT_ROTACAO_S: "inf"
    volumes:
      # Os dois montam no MESMO caminho absoluto de fora. Nao e desleixo: o
      # caminho do anexo atravessa a fronteira dentro do corpo da mensagem, e o
      # worker abre esse caminho no host. Traduzir prefixo aqui obrigaria a
      # traduzir de volta la, e a primeira divergencia seria silenciosa.
      - ${HOME}/AI/fitas:/home/claudinho/AI/fitas:rw
      - ${HOME}/AI/var/run/chat:/home/claudinho/AI/var/run/chat:rw
      # Somente leitura: a recepcao le a lista de cadeiras (do ledger) e a persona de
      # participante (de abertura/), nunca escreve. Sem estes mounts ela nao sobe — a
      # ausencia se declara na subida, em vez de virar sala muda no primeiro giro.
      - ${HOME}/AI/platafirma-harness/abertura:/home/claudinho/AI/platafirma-harness/abertura:ro
      - ${HOME}/AI/platafirma-harness/registro:/home/claudinho/AI/platafirma-harness/registro:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/estado',timeout=8).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      chat-synapse:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    networks: [interna]

networks:
  interna:
    internal: true
  conhecimento:
    external: true
    name: plataforma-wiki_default   # ancorado no `name:` pinado do compose do conhecimento

volumes:
  pgdata:
  dados:
