# registro/porta.yaml — o que a porta (o servidor MCP de operação) executa e o que ela mostra ao modelo.
#
# Estar em `verbos` quer dizer que a porta executa o verbo, pelo malote e pela borda das telas. O atributo
# `modelo` diz se o modelo vê o verbo na lista de tools da sessão (`tools/list`): `modelo: false` deixa o verbo
# registrado e executável por `tools/call` e pelo malote, e fora da lista. Decisão do dono no comentário 4402
# do card 4117. As tools de transporte (as que não são verbo de bin/) entram em `transporte`.
#
# Decisão #5322 do dono na F4073 (18/11/2026): a descrição (toolstring) mora neste manifesto e é relida pela
# porta por mtime sem reinício, sem consulta ao acervo da casa velha.
#
# Atributos de verbo, todos opcionais:
#   nome       slug opcional. O nome exibido da tool na lista da sessão; o resto da porta segue usando o slug.
#   modelo     booleano, padrão true. false = o modelo não vê a tool na lista.
#   retido     booleano, padrão false. true = só serve com PF_TOOLS_LEVA2=1.
#   descricao  toolstring servida em `tools/list`.
#   faces      mapa face -> {instancia, sem_instancia}. A borda chama o verbo na face. `instancia` entra antes do
#              ato na linha do verbo (`motor rag ajuste`), menos nos atos de `sem_instancia` (`motor listar`).
verbos:
  acervo:
    descricao: >-
      cuida do item do acervo, obra ou documento da casa, da incorporação à retirada ·
      use para: incorporar item, «põe essa obra no acervo», «ingere o repo de docs»;
      classificar item, «cataloga essa obra»; definir e relacionar conceitos no tesauro;
      selar impressão, pôr em serviço, retirar e restaurar item; publicar página de wiki ·
      atos: ler, listar, consultar,
      escrever, ingerir, curar, catalogar, definir, relacionar, desrelacionar, derivar,
      desderivar, empacotar, espelhar, recortar, promover, julgar, converter, recolher,
      repor, retirar, restaurar, apagar, extrato, exportar, psql, balde, medir, gerar,
      gerador
  acesso:
    descricao: >-
      grava e revoga concessões de acesso · use para: gravar concessão, «dá acesso a fulano»;
      revogar concessão, «tira o acesso»; ver o que um sujeito alcança, «quem pode entrar?»;
      importar política de acesso; varrer órfãos e tratar órfão, conta órfã; desligar sujeito;
      e sempre que um órfão for detectado · atos: decidir (leitura, concessao), listar (leitura,
      concessao), historico (leitura, concessao), vocabulario (leitura, concessao), politica
      (leitura, politica), importar (escrita, concessao), conceder (escrita, concessao),
      revogar (escrita, concessao), desligar (escrita, sujeito), orfaos (leitura, concessao)
  agente:
    descricao: >-
      delega uma ação a um especialista, na hora · use para: delegar ação síncrona, «roda o
      revisor», «chama o varredor», sub-agente para segunda opinião; definir especialista,
      «quem são os especialistas?» · atos: listar (leitura, especialista), ler (leitura,
      especialista), rodar (escrita, especialista), projetar (escrita, especialista)
  analise:
    descricao: >-
      prepara bases e monta resultados por receita registrada · use para: preparar uma base
      analítica, montar um resultado ou refazer uma execução · atos: preparar (escrita,
      operacao), montar (escrita, operacao), refazer (leitura, operacao), ler (leitura,
      operacao), listar (leitura, operacao), descartar (escrita, operacao), travar (escrita,
      operacao)
  automacao:
    modelo: false
    descricao: >-
      comando de agendamento (fora da lista do modelo até o ops absorver os atos) · atos:
      declarar (escrita, agendamento), listar (leitura, agendamento), rodar (escrita,
      agendamento), desligar (escrita, agendamento), caidas (escrita, agendamento)
  busca:
    descricao: >-
      acha o que a casa e o acervo têm, pelo que você já sabe · não sabe onde está: buscar,
      pela frase, «o que a literatura diz de X?», «onde a casa fala de Y?», «tem fonte sobre
      Z?»; sabe a classe ou o nome: consultar, pela condição ou pelo nome, «as classes cuja
      capacidade é a busca», «gestão estratégica»; sabe a chave: ler, a ficha inteira, «abre
      verbo:tarefas» · use para: SEMPRE ANTES de responder de cabeça sobre a casa ou a
      literatura; subir um degrau quando o de baixo não basta · buscar devolve o que achou, e
      não o que falta; consultar devolve o conjunto exato, e o total zero vem com os valores
      que existem, para conferir a grafia · atos: buscar (leitura, busca), consultar (leitura,
      ficha), ler (leitura, ficha), listar (leitura, ficha)
  casa:
    descricao: >-
      grava e altera o catálogo (classes, dicionários e ligações) e o fichário (fichas) da
      casa; não lê — toda leitura, consulta e listagem é em busca · use para: criar, trocar
      ou recompor classe ou ficha (ontologia, processos, arquitetura, norma, tesauro ou
      inteligência), «grava a ficha», «atualiza a classe»; ensaiar uma mudança sem gravar
      para validar contra a régua, «testa esse YAML antes de gravar»; renomear ou apagar
      ficha, abrir ou encerrar nomes alternativos do vocabulário e gerar o modelo · atos:
      criar (escrita, casa), trocar (escrita, casa), recompor (escrita, casa), ensaiar
      (leitura, casa), renomear (escrita, casa), apagar (escrita, casa), nomes (escrita,
      casa), gerar (leitura, casa), verificar (leitura, casa)
  conferir:
    descricao: >-
      confere o SERVIDO contra o DECLARADO · use para: SEMPRE ANTES de agir sobre algo da casa
      e ANTES de dizer que algo dela não existe, «existe o verbo X?», «tem skill de Y?»; a
      régua da bancada; «o que está no ar bate com o declarado?», em serviço, verbo, skill,
      jobs, acervo e release · atos: existe (leitura, operacao), repo (leitura, operacao),
      commit (leitura, operacao), arranque (leitura, operacao), verbo (leitura, operacao),
      servico (leitura, operacao), skill (leitura, operacao), procedencia (leitura, operacao),
      superficie (leitura, operacao), front (leitura, operacao), sessao (leitura, operacao),
      chapeu (leitura, operacao), ferramental (leitura, operacao), pdp (leitura, operacao),
      alcance (leitura, operacao), vocabulario (leitura, operacao)
  descansar:
    descricao: >-
      encerra a sessão numa chamada e publica mensagem · use para: «encerra», «fecha por hoje»,
      «paramos aqui», ANTES de encerrar o expediente; publicar afirmação, negativa, pedido,
      recusa, contestação ou decisão · atos: encerrar (escrita, sessao), publicar (escrita,
      mensagem)
  expediente:
    descricao: >-
      monta o pacote da cadeira e veste o chapéu · use para: o catálogo de peças; vestir outro
      chapéu quando a matéria do pedido muda, «agora é recuperação» · atos: montar (leitura,
      expediente), rotear (leitura, expediente), catalogo (leitura, expediente)
  fila:
    descricao: >-
      lê e envia mensagens entre cadeiras · use para: SEMPRE que o dono disser «mensagem»,
      «carta», «recado», «caixa», «fila» ou «o que chegou?», e SEMPRE que não houver pedido ou
      o pedido já estiver atendido; ler a caixa, tratar mensagem e contestar; enviar mensagem,
      handoff, resposta ou pauta a outra cadeira · atos: status (leitura, mensagem) · ler
      (leitura, mensagem) · tratar (escrita, mensagem) · enviar (escrita, mensagem) · tipos
      (leitura, mensagem) · contestar (escrita, mensagem)
    faces:
      motor: {}
  infra:
    descricao: >-
      OPERA o serviço e a máquina em que ele roda · use para: SEMPRE que for subir, reiniciar,
      derrubar ou remover serviço, «reinicia a unit», «sobe a stack»; construir e baixar
      imagem; alterar configuração; fazer backup; limpar disco; logs do contêiner, cron, VRAM
      e disco, «os logs do contêiner», «quanto de VRAM está ocupado?» · atos: estado, saude,
      logs, restart, remover, unit-env, cache, hardware, limites, gpu, backup, up, down, ps,
      config, pull, build, limpeza, agenda, units, ingress, medir, pecas, rodar
  lint:
    descricao: >-
      aponta desvio de padrão · use para: ANTES de entregar código, documento ou card, «passa
      o lint», «confere a prosa», «o card está no padrão?» · atos: rodar, detectar, codigo,
      fossil, repo, superficie, arranque, commit, vocabulario, alcance, chapeu, organizacao,
      card, prosa, testes, acervo
  mesa:
    descricao: >-
      guarda na lousa o que fica de uma fita para outra · use para: ler a lousa, «o que ficou
      na mesa?»; abrir ou atualizar item de trabalho, «anota isso»; editar ou apagar trechos do
      corpo do item sem tocar na moldura; dar item como feito, «já fiz o item» · atos: ver,
      item, corpo, fez
  metrica:
    descricao: >-
      mede o uso da porta · use para: «quantas chamadas deram erro?», «quem pediu help?», giro
      e lote por verbo · atos: eventos, dia, ate-acerto, tateio, casos, verbos, comportamento,
      turnos, abertura (leitura, abertura), investigar (escrita, investigacao)
  motor:
    descricao: >-
      ajusta, indexa e mede o motor da busca pelo sentido; não é por aqui que a cadeira acha
      trecho ou ficha, é pela tool busca · use para: parametrizar ou ajustar as consultas do
      motor, «muda o peso do domínio»; indexar e trocar a geração do índice, «reindexa o
      acervo»; montar a bateria: sortear, parear, escrever, julgar e eleger; medir a busca, ver
      consultas, trabalhos e estado, «como está a revocação?»; parar e limpar medida · o ato
      buscar daqui é o que a tool busca repassa, e serve para depurar o motor · atos: listar
      (leitura, texto), ajuste (leitura|escrita, config), buscar (leitura, busca), medir
      (leitura, medida), indexar (escrita, indice), trocar (escrita, geracao), sortear
      (escrita, bateria), lintar (leitura, medida), parear (escrita, lote), escrever (escrita,
      lote), julgar (escrita, lote), eleger (leitura, medida), consultas (leitura, medida),
      trabalhos (leitura, medida), estado (leitura, geracao), parar (escrita, medida), limpar
      (escrita, medida)
    faces:
      motor:
        instancia: rag
        sem_instancia: [listar]
  ontologia:
    modelo: false
    descricao: >-
      lê e grava classes, fichas e dicionários no catálogo e no fichário da Olaria · use para:
      ler classe, ficha, dicionário ou shape, «lê a classe chapeu»; listar classes, descendentes
      (--filhas), referenciadores (--aponta-para) ou chaves gravadas; criar, trocar ou recompor
      classes e fichas; ensaiar mudança sem gravar; renomear, apagar, gerir nomes alternativos e
      gerar o modelo · atos: ler (leitura, ontologia), listar (leitura, ontologia), criar
      (escrita, ontologia), trocar (escrita, ontologia), recompor (escrita, ontologia), ensaiar
      (leitura, ontologia), renomear (escrita, ontologia), apagar (escrita, ontologia), nomes
      (escrita, ontologia), gerar (leitura, ontologia)
  persona:
    modelo: false
  pesquisar:
    descricao: >-
      pesquisa a web aberta com procedência · use para: SEMPRE que a fonte estiver fora do
      acervo, pesquisar fora, «procura na internet», «acha a página oficial»; ler página por
      URL ou bruto custodiado; percorrer um site e extrair o grafo de links; coletar achado;
      resolver DOI, ISBN, ORCID ou CNPJ; conferir as citações de um relatório · atos:
      consultar, resolver, ler, percorrer, coletar, historico, manifesto, exportar,
      citacoes, saude
  preferencia:
    modelo: false
    faces:
      casca: {}
  release:
    descricao: >-
      opera a release, o que está no ar · use para: «que versão está no ar e desde quando?»;
      promover release, «sobe isso», «promove»; expurgar fósseis da release; ler e procurar
      arquivo como está servido · atos: estado (leitura, operacao), listar (leitura, operacao),
      ler (leitura, operacao), procurar (leitura, operacao), conferir (leitura, operacao),
      telas (leitura, operacao), promover (escrita, operacao), expurgar (escrita, operacao),
      migrar (escrita, operacao)
    faces:
      casca: {}
  repo:
    descricao: >-
      opera a bancada do card, do clone ao PR integrado · use para: criar e atualizar bancada;
      ler e procurar nela, diff e histórico; commitar, empurrar ramo, abrir, revisar e
      integrar PR; descartar mudança; sanear bancada; procurar no que está publicado no
      GitHub; e sempre que um card de código for posto em execução ou a esteira reprovar a
      mudança · atos: estado, listar, ler, procurar, historico, diff, commitar, ramo,
      atualizar, sincronizar, abrir, clonar, empurrar, pr-abrir, pr-listar, pr-ver, pr-diff,
      pr-merge, pr-fechar, hooks-listar, hooks-apagar, sanear, lock, git
  seg:
    descricao: >-
      cuida dos segredos e da linha de base de segurança · use para: gerar, checar, rotacionar
      e destruir segredo; fixar linha de base; varrer ativo, «roda a varredura»; «avalia esse
      risco», a régua de segurança de um serviço; e sempre que um segredo for exposto, faltar
      ou vencer · atos: oscap (leitura, casco), isolacao medir (leitura, casco), ssg (escrita,
      regua), keycloak entrar (escrita, credencial), keycloak (escrita, realm), openssl
      (leitura, cripto), segredo ler (leitura, segredo), segredo listar (leitura, segredo),
      segredo gravar (escrita, segredo), segredo importar (escrita, segredo), segredo
      rotacionar (escrita, segredo), segredo exigidos (leitura, segredo), segredo apagar
      (escrita, segredo)
  sessao:
    modelo: false
  tarefas:
    descricao: >-
      conduz o card, da demanda captada à entrega · use para: SEMPRE que o assunto for card,
      épico, feature, story, incidente ou débito técnico; captar demanda, «cria um card»;
      lapidar, dar parecer, apostar, formalizar, priorizar, pôr em execução, concluir, validar
      e entregar card, «move para refinamento», «comenta no card»; declarar, mitigar e fechar
      incidente; «o que está comigo?», «lê o card», «os comentários do card», sign-off; e
      sempre que o pacto quebrar ou uma execução cair · atos: listar, listar-tudo, ler, criar,
      editar, modelo, comentar, comentarios, mover, fechar, apagar, assinar, dt, estados, sub,
      ordenar, bloquear, desbloquear, carteira, espera-dono (leitura, trabalho)
    faces:
      casca: {}
  teste:
    descricao: >-
      roda a suíte do repositório · use para: ANTES de entregar código, «roda os testes», «a
      suíte passa?»

transporte:
  malote:
    descricao: >-
      despacha lista estruturada de itens de verbo em uma chamada · use para:
      cadeia que para no primeiro erro (encadeado=true); duto da saída de um
      verbo para o seguinte (stdin.de); verbo sem tool própria nesta sessão ·
      chamadas independentes vão em paralelo, cada uma pela tool dela ·
      retomada depois do teto começa em lote_next
  ler_arquivo:
    descricao: >-
      lê arquivo pelo caminho · use para: texto por linhas, PDF, EPUB, DOCX, planilha ou
      imagem; o retorno grande que a porta guardou; o arquivo de uma obra pelo caminho
  write_file:
    descricao: >-
      grava arquivo na bancada ou no rascunho da fita · use para: escrever mudança, o arquivo
      inteiro ou a troca de um trecho
  monta_sessao:
    descricao: >-
      abre o expediente da cadeira · use para: PRIMEIRA AÇÃO DA CONVERSA, ANTES de ler ou
      responder o pedido
