# A borda das faces do cubo de controle (card #3516; arq:0057). Um contêiner, sem volume de dado, sem
# segredo e sem credencial própria: o token do dono chega pelo gate do cubo e vai à porta como veio
# (seg:0015 §5). A lista de origens, a URL da porta e as faces são configuração da instância.
#
# Quem sobe e quem põe o gate na frente é a ti (#3565). O gate do cubo (oauth2-proxy-cubo, no core)
# alcança esta borda pelo alias `cubo-borda`, porta 8000, na rede `pf-borda-cubo`, e entrega o token do
# dono (access token) em X-Forwarded-Access-Token. A porta lista o client do gate em PF_FACE_CLIENTS
# (`gate-cubo`); sem a lista ela nega toda fonte face.
name: harness-borda

services:
  borda:
    build: .
    restart: unless-stopped
    environment:
      # Origens que podem escrever (R31): lista fechada da instância, vírgula entre valores. Vazia, a
      # borda lê e não escreve.
      BORDA_ORIGENS: ${BORDA_ORIGENS:-https://controle.platafirma.org}
      # A porta de verbos. Em docker rootless o contêiner não alcança o loopback do host (medido em
      # controle/compose.yaml), então o caminho é o publicado pelo túnel.
      BORDA_PORTA_URL: ${BORDA_PORTA_URL:-https://ops.platafirma.org/mcp}
      # Onde o gate põe o token do dono: o oauth2-proxy-cubo entrega o access token cru em
      # X-Forwarded-Access-Token (e não em Authorization, que ele só preencheria com o ID token). É também o
      # padrão do código (#3575); a linha fica para a instancia que trocar o gate.
      BORDA_CABECALHO_TOKEN: ${BORDA_CABECALHO_TOKEN:-x-forwarded-access-token}
      # Idade máxima do login para escrever, em segundos (#2572): o `auth_time` do token passou disso, a borda
      # responde 401 e a tela leva o dono a sair e entrar. 0 desliga. A leitura não tem o corte.
      BORDA_LOGIN_MAX_S: ${BORDA_LOGIN_MAX_S:-300}
      # Cada face e os verbos dela na release; a lista de atos vem do cabeçalho de cada verbo (`# face:`).
      # A face motor chama o `motor` e, do `fila`, só o `contestar` que o cabeçalho dele declara para ela
      # (#3518, buraco #2555). Texto fixo, sem interpolação: a chave `}` do JSON fecharia o `${...}` do
      # compose. Outra face ou outro caminho entra por compose.override.yaml da instância.
      BORDA_FACES: '{"motor": [{"verbo": "/opt/platafirma/current/harness/bin/motor", "instancia": "rag", "sem_instancia": ["listar"]}, {"verbo": "/opt/platafirma/current/harness/bin/fila"}]}'
    volumes:
      # Só para ler o cabeçalho do verbo. Monta-se a raiz da release, e não só current/, porque current/
      # é link relativo para fora dele (mesma razão do controle/compose.yaml).
      - ${PF_RELEASE_RAIZ:-/opt/platafirma}:${PF_RELEASE_RAIZ:-/opt/platafirma}:ro
    ports:
      - "127.0.0.1:${BORDA_PORTA_HOST:-8092}:8000"
    networks:
      # `default` leva a saída: a borda chama a porta em ops.platafirma.org pelo túnel, e a rede do
      # cubo é interna (sem egresso). É também por ela que sai a porta publicada em loopback.
      default: {}
      cubo:
        aliases: [cubo-borda]

  # A borda da casca do rastreador (card #3738; seg:0016 item 6). A MESMA imagem, outra instancia: atende so
  # `GET|PUT /api/preferencia/tema` para o gate de tarefas.platafirma.org (platafirma-core, story #3739),
  # com a origem dele e o verbo `preferencia` na face `casca`. Instancia propria porque a lista de origens
  # e da borda inteira (R31): a do cubo nao deve aceitar escrita vinda da origem do rastreador, nem o
  # contrario. Sem porta publicada: so o gate do rastreador a alcanca, pela rede de encontro abaixo.
  # O client do gate do rastreador (`gate-rastreador`) entra em PF_FACE_CLIENTS da porta na instancia, junto
  # com a subida do gate; sem a lista a porta nega a fonte face e a casca segue no tema do sistema.
  borda-casca-rastreador:
    build: .
    restart: unless-stopped
    environment:
      BORDA_ORIGENS: ${BORDA_CASCA_RASTREADOR_ORIGENS:-https://tarefas.platafirma.org}
      BORDA_PORTA_URL: ${BORDA_PORTA_URL:-https://ops.platafirma.org/mcp}
      BORDA_CABECALHO_TOKEN: x-forwarded-access-token
      # O corte de login recente e dos atos do cubo; a troca de tema nao o tem (e a rota nao o le).
      BORDA_LOGIN_MAX_S: "0"
      # A frase que a borda poe como fundamento da escrita do tema (a porta exige um para a fonte face).
      BORDA_TEMA_FUNDAMENTO: ${BORDA_TEMA_FUNDAMENTO:-escolha do tema na casca da tela}
      BORDA_FACES: '{"casca": {"verbo": "/opt/platafirma/current/harness/bin/preferencia"}}'
    volumes:
      - ${PF_RELEASE_RAIZ:-/opt/platafirma}:${PF_RELEASE_RAIZ:-/opt/platafirma}:ro
    networks:
      default: {}
      casca-rastreador:
        aliases: [casca-borda-rastreador]

networks:
  # Rede de ENCONTRO com o gate do rastreador (platafirma-core, story #3739): declarada aqui e la com o MESMO
  # `name:` e em nenhum dos dois como `external`, como as outras. `internal`: so o gate e esta borda.
  casca-rastreador:
    name: pf-borda-casca-rastreador
    internal: true

  # Rede de ENCONTRO com o gate do cubo (platafirma-core, card #3565): declarada aqui e lá com o MESMO
  # `name:` e em nenhum dos dois como `external`, o desenho de pf-borda-casa e pf-borda-rastreador:
  # nenhuma das duas stacks depende da outra para subir. `internal`: só o gate e a borda, sem egresso.
  cubo:
    name: pf-borda-cubo
    internal: true
