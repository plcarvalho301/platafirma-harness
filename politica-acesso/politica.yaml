# Política de acesso da PlataFirma — o PAP (Policy Administration Point).
#
# Este arquivo é a FONTE das regras. Muda por merge request, e o fundamento de cada
# alteração fica no histórico do Git — é essa trilha que o auditor pede.
# `acesso politica importar` carrega o vocabulário daqui para concessao.eixo_valor;
# `acesso decidir` avalia um caso contra estas regras sem tocar em banco nenhum.
#
# O que este arquivo NÃO contém: quem tem o quê. Isso é concessão, é instância, e mora
# no registro append-only. Política é tipo; concessão é instância.

versao: 1

# ---------------------------------------------------------------------------
# Vocabulário dos eixos — o contrato entre esta política e a tela de concessão
# ---------------------------------------------------------------------------
eixos:

  # Só o domínio tem hierarquia: concessão no pai alcança o filho, nunca o contrário.
  dominio:
    plataforma:
      rotulo: "Administração da instância — fora de qualquer frente"
      # Sem `instrumento`: plataforma não espelha Iniciativa (seg:0007), é o valor
      # reservado da operação da própria plataforma.
    plataforma-runtime:
      rotulo: "Serviços em execução: contêiner, unit, deploy"
      pai: plataforma
    plataforma-identidade:
      rotulo: "Identidade, concessão e segredo"
      pai: plataforma
    plataforma-acervo:
      rotulo: "Acervo bibliográfico e índice de recuperação"
      pai: plataforma
    plataforma-wiki:
      rotulo: "Wiki: o que a firma decidiu, como nomeia e como opera"
      # Separado de `plataforma-acervo` porque são matérias distintas com concessões
      # distintas: o acervo é texto de terceiro, a wiki é a decisão da casa. Domínio
      # único faria a concessão de ler norma valer para ler decisão interna.
      pai: plataforma
    plataforma-repo:
      rotulo: "Repositorios da PlataFirma: LEITURA do codigo por espelho somente-leitura"
      # Separado de `plataforma-wiki` pelo mesmo motivo que ela se separou do acervo:
      # a wiki e a decisao redigida, o repo e o codigo em vigor. Conceder ler decisao
      # nao pode valer por ler codigo, nem o contrario. Escrever no repo NAO passa por
      # este dominio: e `run_command`, tipo `comando`, negado ao externo.
      pai: plataforma
    plataforma-drive:
      rotulo: "Drive do dono: area de transferencia com colaboracao externa"
      # Separado de `plataforma-wiki` pelo mesmo motivo que ela se separou do acervo:
      # a wiki e o registro da casa, esta pasta e superficie de entrega para quem nao
      # tem a casa. Dominio unico faria conceder uma valer pela outra.
      pai: plataforma
    mensageria:
      # Fora do prefixo `plataforma-` de proposito (ordem do dono, 13/08/2026): uma
      # letra separa `plataforma` de `platafirma`, e typo no eixo do sujeito nega por
      # intersecao, indistinguivel de politica funcionando. A heranca e pelo campo
      # `pai`, nao pelo nome — nada se perde ao sair do prefixo.
      rotulo: "Malha msg: caixa de mensagem entre persona e colaboração externa"
      pai: plataforma

  papel:
    reino:
      rotulo: "Cadeira do reino — alcance amplo, aceito em seg:0006"
    fornecedor:
      rotulo: "Fábrica e colaboração externa — executa card, não administra"
    operador:
      rotulo: "Humano com credencial própria"
    # `pesquisador-externo` REMOVIDO em 02/09/2026 (seguranca): o braco OSINT do agy foi
    # expurgado por ordem do dono nesta data (11a7603 tirou o sujeito; este ato tira o
    # papel e as regras que so ele casava). Papel sem titular e regra viva para ninguem.
    # --- Papéis da floresta de org (docs/escopos-e-papeis.md §3) ------------------
    # Qualificados por `unidade-organizacional`: valem no par, nunca soltos.
    executor:
      rotulo: "Consome no nó — degrau 1 da escada de verbos do rastreador"
    head:
      rotulo: "Responde pelo nó e pelos descendentes — degraus 2 e 3"
    portfolio:
      rotulo: "Compõe e endereça na raiz — degrau 4; ocupação única"
    # `responsavel-de-frente` NÃO é qualificado por unidade: frente é domínio
    # temporário (seg:0005) e ocupa o eixo `dominio`. O papel fica aqui, o `F<n>` lá.
    responsavel-de-frente:
      rotulo: "Responde pelo conjunto de uma frente, enquanto ela corre"

  # ---------------------------------------------------------------------------
  # Unidade organizacional — o nó da floresta de org (card 452, 14/08/2026)
  # ---------------------------------------------------------------------------
  # Eixo separado do `dominio` de propósito: `dominio` diz QUE MATÉRIA é o recurso,
  # a unidade diz DE QUEM ele é. São ortogonais, e `recurso.dominio` é campo único —
  # fundir obrigaria um card de rotação de segredo a escolher entre
  # `plataforma-identidade` e `pf/claudinho-seguranca/cripto`.
  #
  # Este arquivo declara só as RAÍZES. Os nós (`pf/<cadeira>/<gerência>`) nascem de
  # evento de org (`registro/eventos-org.jsonl`), nunca de cadastro aqui — raiz não
  # declarada é valor fora do vocabulário, e o default do PDP nega.
  #
  # Herança desce pelo prefixo do caminho, avaliada pelo PDP e não pelo consumidor:
  # dois avaliadores da mesma regra divergem, e o vocabulário unificado existe para
  # impedir dois mapas de quem-alcança-o-quê.
  #
  # O par (papel, unidade) é ATÔMICO no sujeito. Dois conjuntos independentes fariam
  # `head@pf/claudinho-TI` mais `executor@pf/claudinho-seguranca` produzirem por
  # interseção um `head@pf/claudinho-seguranca` que ninguém concedeu.
  #
  # Órgão cliente é raiz própria, no MESMO espaço de nomes: a linhagem de `orgaoX/...`
  # nunca contém `pf`, não há ancestral comum, e separação dura acrescentaria mecanismo
  # para o que a ausência de raiz comum já entrega. O que sustenta isso é uma regra só:
  # glob SÓ DEPOIS DA RAIZ. `pf/*` vale; `*` e `*/cripto` são recusados no carregamento,
  # e política inválida derruba o boot (seg:0008).
  #
  # Forma da regra que usa o eixo:
  #
  #   - id: <sujeito>-<o-que-faz>-no-no
  #     efeito: permite
  #     motivo: "<por quê> · concedido por <quem> · vence AAAA-MM-DD"
  #     quando: {papel: head, unidade-organizacional: "pf/*"}
  #     acoes: [atribuir]
  #     sobre: ["item:*"]
  #
  # Nenhuma regra usa o eixo hoje, e é assim de propósito: o consumidor declarado
  # (spec do rastreador, #342) escreve as suas com fundamento no Git, como qualquer
  # concessão. Vocabulário não é permissão.
  unidade-organizacional:
    pf:
      rotulo: "PlataFirma — raiz da organização própria"
    # Órgão cliente entra aqui, uma linha por raiz, quando houver o primeiro.

  tema: {}   # vazio por decisão: designação temática é entrega do domínio, ainda não feita

# ---------------------------------------------------------------------------
# Matriz — que papel faz que ação sobre que recurso
# ---------------------------------------------------------------------------
# Negativa vence permissão, qualquer que seja a ordem aqui. Nada fora desta lista é
# permitido: o default do PDP é negar.
regras:

  # --- Reino ------------------------------------------------------------------
  # Estado de 13/08/2026: as 7 cadeiras seguem com o alcance que já têm. Isto não é
  # ausência de regra, é regra escrita — e é ela que se estreita quando as cadeiras
  # novas nascerem segregadas (seg:0006).
  - id: reino-plataforma-tudo
    efeito: permite
    motivo: "cadeira do reino, alcance amplo declarado em seg:0006"
    quando: {papel: reino, dominio: plataforma}
    acoes: ["*"]
    sobre: ["*"]

  # --- Fornecedor: fábrica, OSINT, e o que vier contratado ---------------------
  # A porta é o card; o alcance é o repo. Estado do host não é do fornecedor.
  # ESTREITADA EM 20/08/2026 (claudinho-seguranca, ordem do dono). Dois buracos
  # MEDIDOS na versao anterior, e nenhum deles dependia de bug nenhum:
  #   - `cat *` cobria `cat > arquivo`, que ESCREVE. O proprio PAP admitia isso por
  #     escrito em `fornecedor-le-e-escreve-no-clone`. Saiu: `read_file` ja da a
  #     leitura, com alvo declarado em vez de string.
  #   - `git *` cobria `git -c core.pager=<qualquer coisa>` e `git -c alias.x=!<sh>`,
  #     que executam comando arbitrario COM a permissao do fornecedor. Saiu o glob
  #     aberto; entrou a lista de subcomandos, que nao casa `git -c`.
  # O que sobra aberto por natureza — `python3` e `uv` — nao se fecha com glob: e a
  # propria fabrica rodando teste e script. So verbo nomeado resolve, e e o que esta
  # pedido a claudinho-TI (ver `fornecedor-usa-verbo-operacional`, abaixo).
  # ALLOWLIST DE PREFIXO DE STRING E MITIGACAO, NAO CONTROLE. Fica escrito aqui para
  # que ninguem a leia como se fosse.
  - id: fornecedor-le-repo
    efeito: permite
    motivo: "fornecedor executa card sobre repositorio · estreitada em 20/08/2026: sai `cat *` (escreve) e o glob aberto de git (`git -c` executa arbitrario)"
    quando: {papel: fornecedor, tipo: comando}
    acoes: [run_command]
    sobre: ["git status*", "git diff*", "git log*", "git show*", "git add *",
            "git commit*", "git push*", "git pull*", "git fetch*", "git merge*",
            "git rebase*", "git checkout*", "git switch*", "git restore*",
            "git branch*", "git stash*", "git tag*", "git remote*", "git clone*",
            "git worktree*", "git rev-parse*", "git ls-files*", "git blame*",
            "rg *", "fd *", "python3 *", "uv *", "pytest*", "ls *"]

  # --- Verbo operacional no lugar de run_command (ordem do dono, 20/08/2026) ---
  # O dono: o braco do jaiminho no deploy tem de ser um conjunto de VERBOS
  # OPERACIONAIS, nao `run_command`. A razao e a de cima: allowlist de prefixo julga
  # o TEXTO do comando, e texto se contorna com uma flag. Verbo nomeado julga o ATO.
  #
  # As regras abaixo ja estao escritas e sao INERTES ate os verbos existirem — o
  # default nega o que nao ha. Estao aqui para que o alcance pretendido seja lido no
  # PAP, e nao inferido do codigo depois.
  # CONSTRUCAO DOS VERBOS: claudinho-TI. REGRA: claudinho-seguranca.
  # `run_command` para `fornecedor` SAI no dia em que os verbos subirem, e nao antes:
  # tirar agora deixaria a fabrica sem braco nenhum.
  - id: fornecedor-usa-verbo-operacional
    efeito: permite
    motivo: "o braco da fabrica no deploy e verbo nomeado, nao string de shell · ordem do dono em 20/08/2026 · vence 2026-11-20"
    quando: {papel: fornecedor, dominio: plataforma, tipo: operacao}
    acoes: [repo_clonar, repo_ramo, repo_commitar, repo_empurrar, repo_estado,
            teste_rodar, lint_rodar]
    sobre: ["platafirma-*/*", "modulo-osint/*", "var/tmp/*"]

  - id: fornecedor-sem-estado-do-host
    efeito: nega
    motivo: "estado do host nao e do fornecedor: docker, systemctl, psql e deploy fora do alcance"
    quando: {papel: fornecedor}
    acoes: ["*"]
    sobre: ["docker*", "systemctl*", "psql*", "deploy*", "infra*", "*.env*", "seg *", "acesso *"]

  - id: fornecedor-nao-toca-identidade
    efeito: nega
    motivo: "dominio de identidade e segredo nao se terceiriza"
    quando: {papel: fornecedor, dominio: plataforma-identidade}
    acoes: ["*"]
    sobre: ["*"]

  # --- Operador humano --------------------------------------------------------
  - id: operador-plataforma
    efeito: permite
    motivo: "humano com credencial propria responde pelo que faz"
    quando: {papel: operador, dominio: plataforma}
    acoes: ["*"]
    sobre: ["*"]

  # --- Colaboracao externa que le o acervo (seg:0009) --------------------------
  # Papel separado de `fornecedor` de proposito: a fabrica executa card e nao le
  # acervo; o externo le acervo e nao executa nada. Um papel so daria a uniao dos
  # dois alcances, que e o oposto de necessidade de conhecer.
  #
  # Recurso do acervo tem id `acervo:<colecao>/<dominio>/<obra>` e tipo `acervo`.
  # NAO existe regra de permissao aqui por decisao: sem concessao escrita, o default
  # do PDP nega. Conceder e merge request neste arquivo, com o fundamento no Git.
  #
  # QUEM CONCEDE (decisao do dono, 14/08/2026): claudinho-TI concede acesso INTERNO
  # (cadeira); claudinho-IA concede acesso a EXTERNO. Nos dois casos com autorizacao
  # do dono no ato. O ato de conceder e este merge request; quem faz merge e deploy do
  # servico e quem o pratica. O fundamento escrito e o controle — nao o cracha de quem
  # assina —, e ele nomeia a atividade que exige conhecer.
  #
  # Forma da regra de concessao:
  #
  #   - id: <sujeito>-le-<recorte>
  #     efeito: permite
  #     motivo: "<atividade que exige conhecer> · concedido por <quem> · vence AAAA-MM-DD"
  #     quando: {papel: <papel-do-externo>, dominio: plataforma-acervo, tipo: acervo}
  #     acoes: [rag_buscar]
  #     sobre: ["acervo:firma/<dominio-do-acervo>/*"]
  #
  # `sobre` NUNCA fica vazio: lista vazia vira "*" no PDP por acidente, e acidente
  # nao concede. `acervo:*` so entra por ordem escrita do dono — hoje ha exatamente
  # uma, `jaiminho-le-acervo-inteiro` (20/08/2026). Vencida a data do `motivo`, a
  # regra sai por merge.

  # --- Externo (papel `pesquisador-externo`): REMOVIDO em 02/09/2026 -----------
  # Saíram daqui, no mesmo ato que tirou o papel: jaiminho-le-acervo-inteiro,
  # jaiminho-le-repo, jaiminho-usa-area-de-transferencia, externo-nao-alcanca-resto-
  # do-drive, jaiminho-le-wiki-conceito, externo-nao-le-wiki-interna,
  # externo-nao-executa-comando, externo-nao-toca-identidade. Historico em git
  # (`git log -S pesquisador-externo`). Externo novo entra por concessao nova, com
  # papel proprio e prazo — nao por ressurreicao destas.

  # --- Fabrica: a conta jaiminho-fabrica precisa ABRIR --------------------------
  # Ordem direta do dono em 18/08/2026, contra o repasse a claudinho-seguranca que
  # `org:0020` previa. Escritas por claudinho-TI, no papel `fornecedor` que ja existia:
  # nenhum papel novo nasce aqui. O corte e o de sempre — a fabrica executa card sobre
  # repositorio; estado do host, identidade e o proprio PAP seguem fora.

  - id: fornecedor-monta-a-propria-sessao
    efeito: permite
    motivo: "a persona da conta manda montar a sessao da fabrica como PRIMEIRA acao de toda fita; sem isto a conta nao abre · ordem do dono em 18/08/2026 · vence 2026-11-18"
    quando: {papel: fornecedor, dominio: plataforma, tipo: documento}
    acoes: [monta_sessao]
    sobre: ["sessao:fabrica"]

  # `cat *` ja e permitido em fornecedor-le-repo, e `cat > arquivo` escreve. Negar
  # write_file e permitir cat seria teatro: a regra nomeia o alcance de verdade, que
  # sao os clones de trabalho, e deixa o resto ao default.
  - id: fornecedor-le-e-escreve-no-clone
    efeito: permite
    motivo: "a fabrica constroi dentro do clone do card: le e escreve arquivo de repositorio, e nada fora dele · ordem do dono em 18/08/2026 · vence 2026-11-18"
    quando: {papel: fornecedor, dominio: plataforma, tipo: documento}
    acoes: [read_file, write_file]
    sobre: ["platafirma-*/*", "modulo-osint/*", "var/tmp/*"]

  # A porta da fabrica e o card no board (org:0003) — sem estes sub-atos ela recebe
  # trabalho e nao tem como responder. `apagar` e `fechar` ficam de fora: sumir com
  # card e mover para entregue sao atos do dono, nao de quem executa.
  - id: fornecedor-opera-o-card
    efeito: permite
    motivo: "porta unica da fabrica e o card (org:0003): le, lista, comenta, move e quebra em sub · ordem do dono em 18/08/2026 · vence 2026-11-18"
    quando: {papel: fornecedor, tipo: comando}
    acoes: [run_command]
    sobre: ["tarefas ler*", "tarefas listar*", "tarefas comentar*", "tarefas mover*", "tarefas sub*", "tarefas criar*"]

  # Segundo cadeado, escrito em vez de deixado ao default: quem e julgado pela
  # politica nao edita a politica, nem a persona que o define, nem a conduta.
  - id: fornecedor-nao-edita-o-que-o-julga
    efeito: nega
    motivo: "PAP, persona e conduta nao se editam por quem e julgado por eles"
    quando: {papel: fornecedor}
    acoes: ["*"]
    sobre: ["politica-acesso/*", "*/politica-acesso/*", "abertura/*", "*/abertura/*"]

  # --- Fabrica: leitura do acervo de trabalho (ordem do dono, 20/08/2026) -------
  # ORDEM DIRETA DO DONO nesta data, com dispensa expressa do repasse a
  # claudinho-seguranca: "eu to autorizando, n precisa passar pelo leonardo". Escrita
  # por claudinho-TI, no papel `fornecedor` que ja existia — nenhum papel novo nasce
  # aqui, e a regua continua sendo `seg:0009` (default deny, permissao nomeada, prazo,
  # `acervo:pessoal/*` negado sempre).
  #
  # ATIVIDADE QUE EXIGE CONHECER, que e a linha sem a qual seg:0009 nao admite merge:
  # a fabrica constroi contra criterio de engenharia (padrao de adaptador, cache,
  # resiliencia) e hoje responde de memoria de treino. Sem o acervo ela inventa a
  # regua em vez de citar a da casa — foi por isso que o dono mandou conceder.
  #
  # ALCANCE: leitura do acervo de TRABALHO e so. Wiki, drive e caixa seguem fora
  # (nao ha regra para `fornecedor` neles, e o default nega).
  # Alargada em 20/08/2026, mesma ordem do dono que deu o acervo inteiro ao
  # `pesquisador-externo`: as duas contas do mesmo motor tem de enxergar igual, ou o
  # bracO que o dono usa no dia responde diferente do outro sem ninguem entender por
  # que. O `sobre` acompanhou o alvo que o jaiminho-server passou a submeter depois
  # do e5fd33a (`acervo:*`): concessao nominal a `acervo:firma/*` NAO casa o alvo
  # generico, e sem esta emenda a conta da fabrica caía em negativa total.
  - id: fabrica-le-acervo-inteiro
    efeito: permite
    motivo: "a fabrica constroi contra criterio citavel do acervo em vez de memoria de treino · ordem do dono em 20/08/2026, alargada ao acervo inteiro na mesma data · vence 2026-11-20"
    quando: {papel: fornecedor, dominio: plataforma-acervo, tipo: acervo}
    acoes: [rag_buscar, rag_facetas]
    sobre: ["acervo:*"]

  # Espelha `externo-nunca-alcanca-acervo-pessoal` para o papel da fabrica. Escrita, e
  # nao deixada ao default: a regra acima abriu `acervo:*` para `fornecedor`, e
  # titularidade nao se protege por ausencia de permissao — negativa vence permissao.
  # `fornecedor-nunca-alcanca-acervo-pessoal` REMOVIDA em 20/08/2026, pelo mesmo ato
  # que removeu a negativa equivalente do `pesquisador-externo`. O titular decide quem
  # le a colecao dele.

  # --- Wiki como superficie universal (ordem do dono, 20/08/2026) -------------
  # A wiki e alcancavel por qualquer bot autenticado e autorizado AQUI, seja qual for
  # o servidor por onde ele entra e a conta onde ele roda. Ate 20/08 a unica
  # autorizacao por sujeito a wiki vivia DENTRO do jaiminho-server, feita para um bot
  # so; o `wiki-mcp` tinha um segredo compartilhado e mais nada, e quem o portava
  # tinha `edit_page` e `upload_file` junto. O PEP agora e o mesmo nos dois.
  #
  # LER e ESCREVER sao acoes separadas de proposito, e ENVIAR ARQUIVO e uma terceira:
  # conceder edicao de texto nao pode conceder envio de binario, que e superficie de
  # outra natureza (tipo de arquivo, tamanho, o que o servidor faz com ele depois).

  - id: fornecedor-nao-escreve-na-wiki
    efeito: nega
    motivo: "a entrega da fabrica e commit no repo, nao pagina de wiki"
    quando: {papel: fornecedor, dominio: plataforma-wiki}
    acoes: [wiki_editar, wiki_enviar_arquivo]
    sobre: ["*"]
