# Política de acesso da PlataFirma — o PAP (Policy Administration Point).
#
# Este arquivo é a FONTE das regras. Muda por merge request, e o fundamento de cada
# alteração fica no histórico do Git — é essa trilha que o auditor pede.
# `acesso politica importar` carrega o vocabulário daqui para concessao.eixo_valor;
# `acesso decidir` avalia um caso contra estas regras sem tocar em banco nenhum.
#
# O que este arquivo NÃO contém: quem tem o quê. Isso é concessão, é instância, e mora
# no registro append-only. Política é tipo; concessão é instância.

versao: 1

# ---------------------------------------------------------------------------
# Vocabulário dos eixos — o contrato entre esta política e a tela de concessão
# ---------------------------------------------------------------------------
eixos:

  # Só o domínio tem hierarquia: concessão no pai alcança o filho, nunca o contrário.
  dominio:
    plataforma:
      rotulo: "Administração da instância — fora de qualquer frente"
      # Sem `instrumento`: plataforma não espelha Iniciativa (seg:0007), é o valor
      # reservado da operação da própria plataforma.
    plataforma-runtime:
      rotulo: "Serviços em execução: contêiner, unit, deploy"
      pai: plataforma
    plataforma-identidade:
      rotulo: "Identidade, concessão e segredo"
      pai: plataforma
    plataforma-acervo:
      rotulo: "Acervo bibliográfico e índice de recuperação"
      pai: plataforma
    plataforma-mensageria:
      rotulo: "Malha msg: caixa de mensagem entre persona e colaboração externa"
      pai: plataforma

  papel:
    reino:
      rotulo: "Cadeira do reino — alcance amplo, aceito em seg:0006"
    fornecedor:
      rotulo: "Fábrica e colaboração externa — executa card, não administra"
    operador:
      rotulo: "Humano com credencial própria"
    pesquisador-externo:
      rotulo: "Colaboração externa que lê o acervo por concessão — não executa comando, não administra"

  tema: {}   # vazio por decisão: designação temática é entrega do domínio, ainda não feita

# ---------------------------------------------------------------------------
# Matriz — que papel faz que ação sobre que recurso
# ---------------------------------------------------------------------------
# Negativa vence permissão, qualquer que seja a ordem aqui. Nada fora desta lista é
# permitido: o default do PDP é negar.
regras:

  # --- Reino ------------------------------------------------------------------
  # Estado de 13/08/2026: as 7 cadeiras seguem com o alcance que já têm. Isto não é
  # ausência de regra, é regra escrita — e é ela que se estreita quando as cadeiras
  # novas nascerem segregadas (seg:0006).
  - id: reino-plataforma-tudo
    efeito: permite
    motivo: "cadeira do reino, alcance amplo declarado em seg:0006"
    quando: {papel: reino, dominio: plataforma}
    acoes: ["*"]
    sobre: ["*"]

  # --- Fornecedor: fábrica, OSINT, e o que vier contratado ---------------------
  # A porta é o card; o alcance é o repo. Estado do host não é do fornecedor.
  - id: fornecedor-le-repo
    efeito: permite
    motivo: "fornecedor executa card sobre repositorio"
    quando: {papel: fornecedor, tipo: comando}
    acoes: [run_command]
    sobre: ["git *", "rg *", "fd *", "cat *", "python3 *", "uv *", "pytest*", "ls *"]

  - id: fornecedor-sem-estado-do-host
    efeito: nega
    motivo: "estado do host nao e do fornecedor: docker, systemctl, psql e deploy fora do alcance"
    quando: {papel: fornecedor}
    acoes: ["*"]
    sobre: ["docker*", "systemctl*", "psql*", "deploy*", "infra*", "*.env*", "seg *", "acesso *"]

  - id: fornecedor-nao-toca-identidade
    efeito: nega
    motivo: "dominio de identidade e segredo nao se terceiriza"
    quando: {papel: fornecedor, dominio: plataforma-identidade}
    acoes: ["*"]
    sobre: ["*"]

  # --- Operador humano --------------------------------------------------------
  - id: operador-plataforma
    efeito: permite
    motivo: "humano com credencial propria responde pelo que faz"
    quando: {papel: operador, dominio: plataforma}
    acoes: ["*"]
    sobre: ["*"]

  # --- Colaboracao externa que le o acervo (seg:0009) --------------------------
  # Papel separado de `fornecedor` de proposito: a fabrica executa card e nao le
  # acervo; o externo le acervo e nao executa nada. Um papel so daria a uniao dos
  # dois alcances, que e o oposto de necessidade de conhecer.
  #
  # Recurso do acervo tem id `acervo:<colecao>/<dominio>/<obra>` e tipo `acervo`.
  # NAO existe regra de permissao aqui por decisao: sem concessao escrita, o default
  # do PDP nega. Conceder e merge request neste arquivo, com o fundamento no Git.
  #
  # QUEM CONCEDE: claudinho-TI, com autorizacao do dono no ato (decisao do dono,
  # 13/08/2026). O ato de conceder e este merge request; quem faz merge e deploy do
  # servico e quem o pratica. O fundamento escrito e o controle — nao o cracha de
  # quem assina.
  #
  # Forma da regra de concessao:
  #
  #   - id: <sujeito>-le-<recorte>
  #     efeito: permite
  #     motivo: "<atividade que exige conhecer> · concedido por <quem> · vence AAAA-MM-DD"
  #     quando: {papel: pesquisador-externo, dominio: plataforma-acervo, tipo: acervo}
  #     acoes: [rag_buscar]
  #     sobre: ["acervo:firma/<dominio-do-acervo>/*"]
  #
  # `sobre` NUNCA fica vazio nem recebe "*": lista vazia vira "*" no PDP, e "*"
  # entrega o corpus inteiro. Vencida a data do `motivo`, a regra sai por merge.

  - id: externo-nunca-alcanca-acervo-pessoal
    efeito: nega
    motivo: "colecao pessoal e do titular, nao e acervo de trabalho: fora de qualquer concessao a externo"
    quando: {papel: pesquisador-externo}
    acoes: ["*"]
    sobre: ["acervo:pessoal/*"]

  - id: externo-nao-executa-comando
    efeito: nega
    motivo: "colaboracao externa le acervo, nao opera o host: nenhum comando, nenhuma shell"
    quando: {papel: pesquisador-externo, tipo: comando}
    acoes: ["*"]
    sobre: ["*"]

  # Canal exclusivo do Jaiminho com claudinho-IA (card 344). O recurso e a CAIXA, nao
  # o broker: ele nao tem credencial do Valkey e fala com o PEP do ops-server, que
  # valida o JWT e escreve em nome dele. `sobre` nomeia as duas caixas e nada mais —
  # nenhuma das outras seis cadeiras e alcancavel por ele, e nenhuma o alcanca.
  - id: jaiminho-canal-exclusivo-com-IA
    efeito: permite
    motivo: "canal unico do colaborador externo com a cadeira que o contrata (card 344) · concedido por claudinho-TI com autorizacao do dono em 13/08/2026 · vence 2026-11-11"
    quando: {papel: pesquisador-externo, dominio: plataforma-mensageria, tipo: mensagem}
    acoes: [msg_enviar, msg_ler]
    sobre: ["caixa:jaiminho", "caixa:claudinho-IA"]

  - id: externo-nao-toca-identidade
    efeito: nega
    motivo: "dominio de identidade e segredo nao se concede a externo"
    quando: {papel: pesquisador-externo, dominio: plataforma-identidade}
    acoes: ["*"]
    sobre: ["*"]
