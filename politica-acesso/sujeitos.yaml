# Projeção de sujeito — de quem o token diz ser, para o que o PDP precisa saber.
#
# INTERINO POR DESENHO. O lugar certo destes atributos é o token: o realm projeta
# papel e domínio em claim, e o serviço lê. Enquanto o client é um só e compartilhado
# pelas sete cadeiras (card 436), o token não carrega isso — e sem esta tabela o PEP
# não teria como montar o Sujeito, logo negaria tudo por atributo ausente.
#
# CHAVE: `preferred_username` do JWT, ou o `sub` quando não há username. O que está
# aqui foi medido no log de auditoria (~/AI/var/log/ops/), não suposto: em 13/08/2026
# só dois sujeitos aparecem — o dono (OIDC, azp claudinho-mcp) e `claudinho` (rota
# de emergência por token estático).
#
# DEFAULT: sujeito ausente desta tabela NÃO tem papel, e o PDP nega por atributo
# ausente. Fail-closed é o ponto — acrescentar linha aqui é ato de concessão e passa
# por merge, como qualquer regra do PAP.
#
# DESLIGAMENTO: `client`, `conta` e `segredos` dizem ONDE o sujeito existe fora deste
# arquivo, e são o que `acesso desligar` tem por alvo (seg:0011 item 7). Sujeito sem
# nenhum dos três não se sabe desligar — `acesso orfaos` reprova por isso, e reprova
# na admissão, não no dia da saída. O PDP ignora estes campos.

versao: 1

sujeitos:

  # O dono, por credencial própria no realm. `operador` porque é humano que responde
  # pelo que faz (regra operador-plataforma), não cadeira.
  megafone:
    natureza: pessoa
    papeis: [operador]
    dominios: [plataforma]
    usuario: megafone

  # Rota de emergência: token estático, prazo declarado no server. Mesmo alcance do
  # anterior porque é a mesma mão — é o dono quando o realm cai.
  claudinho:
    natureza: pessoa
    papeis: [operador]
    dominios: [plataforma]
    conta: claudinho

  # Colaboração externa em modelo DMZ (card 344, seg:0009). Lê acervo por concessão
  # nomeada e fala pelo canal exclusivo com claudinho-IA. Não executa comando, não
  # toca identidade — as três negativas duras do PAP pegam este papel.
  # Token real: client L0R8OJ (service account), criado em 13/08/2026 por claudinho-TI
  # com autorizacao do dono. sub do realm cc897004-7afd-4a53-9a16-c568220d524c; o
  # `preferred_username` sai como `jaiminho` por mapper hardcoded no client, e e por
  # ele que o PEP resolve o sujeito e monta `caixa:jaiminho`.
  jaiminho:
    natureza: servico
    papeis: [pesquisador-externo]
    dominios: [plataforma-acervo, plataforma-wiki, plataforma-drive, mensageria]
    client: L0R8OJ
    conta: jaiminho

  # Segunda conta da fábrica, motor `agy` (Antigravity, assinatura do dono, sem API
  # paga). Vínculo e razão: `org:0020`. NÃO é o Jaiminho — contas, sujeitos e papéis
  # distintos (`seg:0011`); o nome sugere um vínculo que a própria org:0020 nega.
  #
  # PAPEL `fornecedor`, não `pesquisador-externo`: o rótulo do papel em politica.yaml
  # é literalmente «Fábrica e colaboração externa — executa card, não administra», e as
  # três regras dele (le-repo, sem-estado-do-host, nao-toca-identidade) são o alcance
  # que a fábrica já tem. Aplicar papel existente é implementação; papel NOVO segue
  # pedido a claudinho-seguranca (org:0020, 18/08/2026) e não se inventa aqui.
  #
  # DOMÍNIO `plataforma-runtime` e só ele: é o domínio que o PEP carimba em
  # `run_command` (ops-server, DOM_RUNTIME). O ancestral `plataforma` daria de brinde
  # acervo, wiki, drive e identidade por herança de linhagem.
  #
  # PENDENTE, medido em 18/08/2026 e fora do alcance desta cadeira:
  #   - `client` no realm: identidade é de claudinho-seguranca, e kcadm está sem
  #     credencial nesta sessão. Enquanto não existir, esta linha não autentica
  #     ninguém — o PEP resolve por `preferred_username` e nega o que não casa.
  #   - conta de SO própria (`seg:0013`): exige root, não há uid `jaiminho-fabrica`.
  #     Hoje `run_command` executaria sob uid 1001, o que a régua de segregação
  #     (`seg:0011`) não aceita.
  jaiminho-fabrica:
    natureza: servico
    papeis: [fornecedor]
    # `plataforma`, nao `plataforma-runtime`: monta_sessao, read_file e write_file sao
    # carimbados com `plataforma` pelo PEP, e runtime e FILHO — heranca desce, nunca
    # sobe. O que segura o alcance extra nao e o eixo, e a matriz: para `fornecedor`
    # nao ha regra de acervo, wiki nem drive, e o default do PDP nega; identidade tem
    # negativa escrita.
    dominios: [plataforma]
    conta: jaiminho-fabrica
