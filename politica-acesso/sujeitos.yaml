# Projeção de sujeito — de quem o token diz ser, para o que o PDP precisa saber.
#
# INTERINO POR DESENHO. O lugar certo destes atributos é o token: o realm projeta
# papel e domínio em claim, e o serviço lê. Enquanto o client é um só e compartilhado
# pelas sete cadeiras (card 436; os 7 clients-por-cadeira que divergiam disso no realm foram extintos em 25/08/2026, card 163), o token não carrega isso — e sem esta tabela o PEP
# não teria como montar o Sujeito, logo negaria tudo por atributo ausente.
#
# CHAVE: `preferred_username` do JWT, ou o `sub` quando não há username. O que está
# aqui foi medido no log de auditoria (~/AI/var/log/ops/), não suposto: em 13/08/2026
# só dois sujeitos aparecem — o dono (OIDC, azp claudinho-mcp) e `claudinho` (rota
# de emergência por token estático).
#
# DEFAULT: sujeito ausente desta tabela NÃO tem papel, e o PDP nega por atributo
# ausente. Fail-closed é o ponto — acrescentar linha aqui é ato de concessão e passa
# por merge, como qualquer regra do PAP.
#
# DESLIGAMENTO: `client`, `conta` e `segredos` dizem ONDE o sujeito existe fora deste
# arquivo, e são o que `acesso desligar` tem por alvo (seg:0011 item 7). Sujeito sem
# nenhum dos três não se sabe desligar — `acesso orfaos` reprova por isso, e reprova
# na admissão, não no dia da saída. O PDP ignora estes campos.

versao: 1

sujeitos:

  # O dono, por credencial própria no realm. `operador` porque é humano que responde
  # pelo que faz (regra operador-plataforma), não cadeira.
  megafone:
    natureza: pessoa
    papeis: [operador]
    dominios: [plataforma]
    usuario: megafone

  # Rota de emergência: token estático, prazo declarado no server. Mesmo alcance do
  # anterior porque é a mesma mão — é o dono quando o realm cai.
  claudinho:
    natureza: pessoa
    papeis: [operador]
    dominios: [plataforma]
    conta: claudinho

  # PROMOVIDO A `dev` em 27/08/2026 (card #2899, ordem do dono): faz tudo que a
  # cadeira faz, menos publicar em producao. O modelo DMZ (read-only, canal exclusivo
  # com claudinho-IA) FOI SUBSTITUIDO — a contencao agora e a CONTA SEGREGADA
  # (uid 1003, container proprio, credencial de push escopada), nao mais o PAP.
  # Regras `dev-*` em politica.yaml; as `pesquisador-externo` viram inertes.
  # Token real: client L0R8OJ (service account), criado em 13/08/2026 por claudinho-TI
  # com autorizacao do dono. sub do realm cc897004-7afd-4a53-9a16-c568220d524c; o
  # `preferred_username` sai como `jaiminho` por mapper hardcoded no client, e e por
  # ele que o PEP resolve o sujeito e monta `caixa:jaiminho`.
  jaiminho:
    natureza: servico
    papeis: [dev]
    dominios: [plataforma]
    client: L0R8OJ
    conta: jaiminho

  # Segunda conta da fábrica, motor `agy` (Antigravity, assinatura do dono, sem API
  # paga). Vínculo e razão: `org:0020`. NÃO é o Jaiminho — contas, sujeitos e papéis
  # distintos (`seg:0011`); o nome sugere um vínculo que a própria org:0020 nega.
  #
  # PAPEL `fornecedor`, não `pesquisador-externo`: o rótulo do papel em politica.yaml
  # é literalmente «Fábrica e colaboração externa — executa card, não administra», e as
  # três regras dele (le-repo, sem-estado-do-host, nao-toca-identidade) são o alcance
  # que a fábrica já tem. Aplicar papel existente é implementação; papel NOVO segue
  # pedido a claudinho-seguranca (org:0020, 18/08/2026) e não se inventa aqui.
  #
  # CLIENT criado no realm em 18/08/2026 por claudinho-TI, com ordem do dono: service
  # account, sem fluxo de navegador, `preferred_username` fixo em `jaiminho-fabrica`
  # por hardcoded-claim-mapper e `aud` em `ops-mcp`. Token conferido contra o realm
  # vivo antes desta linha entrar — id interno eccde9b9.
  #
  # PENDENTE, e fora do alcance desta cadeira:
  #   - conta de SO própria (`seg:0013`): exige root, não há uid `jaiminho-fabrica`.
  #     Hoje `run_command` executaria sob uid 1001, o que a régua de segregação
  #     (`seg:0011`) não aceita.
  jaiminho-fabrica:
    natureza: servico
    papeis: [fornecedor]
    # `plataforma`, nao `plataforma-runtime`: monta_sessao, read_file e write_file sao
    # carimbados com `plataforma` pelo PEP, e runtime e FILHO — heranca desce, nunca
    # sobe. O que segura o alcance extra nao e o eixo, e a matriz: para `fornecedor`
    # nao ha regra de acervo, wiki nem drive, e o default do PDP nega; identidade tem
    # negativa escrita.
    dominios: [plataforma]
    client: jaiminho-fabrica
    conta: jaiminho-fabrica

  # DUAL-KEY Onda 5 (#2678/#137): o PEP passa a chavear por `sub`. Esta entrada traduz o
  # MESMO grant de fornecedor para o restart nao trancar a fabrica (jaiminho-fabrica faz
  # ~9k tool calls/dia, medido no log 25/08). A chave username fica ate o restart validar.
  e57eadb1-ec5d-41b5-a1be-e6d62196cff5:
    natureza: servico
    papeis: [fornecedor]
    dominios: [plataforma]
    client: jaiminho-fabrica
    conta: jaiminho-fabrica

  # --- Transição para chave por `sub` (#137, 25/08/2026) -----------------------
  # As entradas abaixo repetem as de cima chaveadas pelo `sub` do realm. É ADITIVO
  # de propósito: o código em produção hoje resolve o sujeito por
  # `preferred_username`, e o código do #2287 passa a resolver por `sub`. Com as duas
  # chaves presentes, os dois casam — a troca do servidor deixa de ter janela em que
  # todo sujeito fica sem papel e o PDP nega tudo por atributo ausente. Foi esse
  # exato fail-closed que trancou as cadeiras em 14/08 (incidente do #137).
  #
  # MEDIDO em ~/AI/var/log/ops/ (25/08/2026), não suposto — e a medida sozinha já
  # prova a tese do card: `megafone` (11.288 linhas) e `g48ufn` (3.464 linhas) são
  # DOIS usernames com o MESMO sub b6986be0. O rename trocou a chave; a identidade
  # nunca mudou.
  #
  # SAEM daqui quando o #2287 estiver em produção e medido: aí as chaves por username
  # viram lixo, e lixo em PAP é superfície. Enquanto o servidor velho puder voltar,
  # ficam.

  # o dono — mesmo sub de `megafone` e do antigo `g48ufn`
  b6986be0-c5b6-4693-839f-73c90b79b25a:
    natureza: pessoa
    papeis: [operador]
    dominios: [plataforma]
    usuario: megafone

  # colaboração externa — mesmo sujeito de `jaiminho`, client L0R8OJ
  cc897004-7afd-4a53-9a16-c568220d524c:
    natureza: servico
    papeis: [dev]
    dominios: [plataforma]
    client: L0R8OJ
    conta: jaiminho

  # `claudinho` (rota de emergência) e `jaiminho-fabrica` NÃO ganham entrada por sub,
  # e cada um por uma razão diferente:
  #   - a rota de emergência é token estático, que não é JWT e não tem `sub` — o log
  #     mostra 2.136 linhas com sub `-`. Se o servidor novo fizer `sujeito = sub` sem
  #     fallback explícito, o sujeito vira `-`, não casa com entrada nenhuma, e a mão
  #     que existe para quando o realm cai morre junto com o realm. É o primeiro item
  #     da revisão do #2287.
  #   - `jaiminho-fabrica` nunca atuou: zero linha no log de auditoria. Sem uso não há
  #     `sub` medido, e sub suposto em PAP é pior que ausente.
