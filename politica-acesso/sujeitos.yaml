# Projeção de sujeito — de quem o token diz ser, para o que o PDP precisa saber.
#
# INTERINO POR DESENHO. O lugar certo destes atributos é o token: o realm projeta
# papel e domínio em claim, e o serviço lê. Enquanto o client é um só e compartilhado
# pelas sete cadeiras (card 436; os 7 clients-por-cadeira que divergiam disso no realm foram extintos em 25/08/2026, card 163), o token não carrega isso — e sem esta tabela o PEP
# não teria como montar o Sujeito, logo negaria tudo por atributo ausente.
#
# CHAVE: `preferred_username` do JWT, ou o `sub` quando não há username. O que está
# aqui foi medido no log de auditoria da porta (ops-mcp), não suposto: em 13/08/2026
# só dois sujeitos aparecem — o dono (OIDC, azp claudinho-mcp) e `claudinho` (rota
# de emergência por token estático).
#
# DEFAULT: sujeito ausente desta tabela NÃO tem papel, e o PDP nega por atributo
# ausente. Fail-closed é o ponto — acrescentar linha aqui é ato de concessão e passa
# por merge, como qualquer regra do PAP.
#
# DESLIGAMENTO: `client`, `conta` e `segredos` dizem ONDE o sujeito existe fora deste
# arquivo, e são o que `acesso desligar` tem por alvo (seg:0011 item 7). Sujeito sem
# nenhum dos três não se sabe desligar — `acesso orfaos` reprova por isso, e reprova
# na admissão, não no dia da saída. O PDP ignora estes campos.

versao: 1

sujeitos:

  # O dono, por credencial própria no realm. `operador` porque é humano que responde
  # pelo que faz (regra operador-plataforma), não cadeira.
  megafone:
    natureza: pessoa
    papeis: [operador]
    dominios: [plataforma]
    usuario: megafone

  # Rota de emergência (22/09/2026): não há sujeito de emergência no PAP. Em sufoco
  # (MCP ou realm fora), o dono entra por ssh.platafirma.org e roda a cadeira direto
  # no host, sem MCP. Isso substituiu a antiga conta `claudinho` de token estático,
  # removida nesta data junto com as contas-bot: conta-bot roda na máquina do dono e
  # se autoriza na saída (chave no forge), não no PAP (desenho do dono, 22/09; a
  # arquitetura de authn/authz de terceiros vai ao #180).


  # --- Transição para chave por `sub` (#137, 25/08/2026) -----------------------
  # As entradas abaixo repetem as de cima chaveadas pelo `sub` do realm. É ADITIVO
  # de propósito: o código em produção hoje resolve o sujeito por
  # `preferred_username`, e o código do #2287 passa a resolver por `sub`. Com as duas
  # chaves presentes, os dois casam — a troca do servidor deixa de ter janela em que
  # todo sujeito fica sem papel e o PDP nega tudo por atributo ausente. Foi esse
  # exato fail-closed que trancou as cadeiras em 14/08 (incidente do #137).
  #
  # MEDIDO no log de auditoria da porta (25/08/2026), não suposto — e a medida sozinha já
  # prova a tese do card: `megafone` (11.288 linhas) e `g48ufn` (3.464 linhas) são
  # DOIS usernames com o MESMO sub b6986be0. O rename trocou a chave; a identidade
  # nunca mudou.
  #
  # SAEM daqui quando o #2287 estiver em produção e medido: aí as chaves por username
  # viram lixo, e lixo em PAP é superfície. Enquanto o servidor velho puder voltar,
  # ficam.

  # o dono — mesmo sub de `megafone` e do antigo `g48ufn`
  b6986be0-c5b6-4693-839f-73c90b79b25a:
    natureza: pessoa
    papeis: [operador]
    dominios: [plataforma]
    usuario: megafone

  # As contas-bot (jaiminho-fabrica) e a rota de emergência por token estático
  # (claudinho) foram removidas em 22/09/2026 (desenho do dono): conta-bot roda na
  # máquina do dono e se autoriza na saída (forge), não no PAP; a emergência é SSH ao
  # host. Resta um sujeito: o dono, por `preferred_username` (megafone) e por `sub`
  # (b6986be0). A arquitetura de authn/authz de terceiros e o fim deste arquivo
  # interino vão ao #180.
