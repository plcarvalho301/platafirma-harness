[project]
name = "harness-recuperacao"
version = "0.1.0"
description = "Adaptadores de recuperação de estado do harness — mesa, board, fila, catálogo, envelope, PEP (card #317)."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "tokenizers>=0.20",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["."]
