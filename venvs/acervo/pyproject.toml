# Venv `acervo` da release (desenho #3010 §2): /opt/platafirma/venv/acervo-<hash-do-uv.lock>,
# atalhado em /opt/platafirma/current/venv/acervo. Construido por `release promover` com
#   uv sync --frozen --no-dev --no-install-project --project venvs/acervo
#
# Dependencias MEDIDAS por import dos consumidores do venv acervo:
#   boto3      bin/_acervo/bancada (shebang /opt/platafirma/current/venv/acervo/bin/python)
#              bin/_acervo/objeto (shebang e bin/acervo: "$PLATAFIRMA_RELEASE/venv/acervo/bin/python"; `acervo ler biblioteca objeto`)
#   owlready2  conhecimento/ontologia/projecao/gerar-e-raciocinar.py:272-273 (World,
#              sync_reasoner_hermit), chamado por bin/curar (_hermit) com este python.
#              O HermiT vem dentro do owlready2 e roda no java do sistema (/usr/bin/java).
#   rdflib     conhecimento/ontologia/projecao/gerar-e-raciocinar.py:274 (Turtle -> RDF/XML).
# O resto do que esses importam e biblioteca padrao ou lib/raizes.py da arvore.
# Card #3130: sem owlready2 aqui, curar --conceito/--pai/--relacionar reprovava toda escrita.
[project]
name = "venv-acervo"
version = "0"
description = "Dependencias do venv acervo da release (objeto do acervo no MinIO e projecao formal da ontologia com HermiT)."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "owlready2>=0.47",
    "rdflib>=7.0",
]
