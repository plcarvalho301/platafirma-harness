name: jaiminho

services:
  jaiminho:
    build: .
    image: platafirma/jaiminho:local
    container_name: jaiminho
    restart: unless-stopped
    env_file: [.env]
    # Porta so no loopback do host: quem chama e claudinho-TI ou, adiante, a ponte
    # Matrix. Nao ha rota no tunel — o Jaiminho nao e superficie publica.
    ports: ["127.0.0.1:8021:8021"]
    # Rede default (bridge): alcanca a internet — auth/ops pela porta publica e a
    # API do Google. NAO alcanca 127.0.0.1 do host, logo nao alcanca o Valkey da
    # malha msg. Esse isolamento e o desenho, nao acidente (card 437).
    networks: [saida]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8021/estado',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  saida:
    driver: bridge
