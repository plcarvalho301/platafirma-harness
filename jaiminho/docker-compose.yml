name: jaiminho

services:
  jaiminho:
    build: .
    image: platafirma/jaiminho:local
    container_name: jaiminho
    restart: unless-stopped
    env_file: [.env]
    # A ponte MCP escuta so DENTRO do container (127.0.0.1:8022): quem a usa e o
    # `agy` que roda aqui. Nao ha porta publicada nem rota no tunel — o Jaiminho
    # nao e superficie publica. Chamada vem por `docker exec`.
    volumes:
      # A casa dele: home inteiro persistente. Nada nosso mora aqui (codigo e
      # `agy` vem de /opt/pf, da imagem), entao volume velho nunca mascara
      # entrega nova. ~/bin e ~/lib sobrevivem a recreate — e o ponto.
      - "casa:/home/jaiminho"
      # Credencial do `agy` em volume proprio, aninhado: rebuild nao desloga.
      - "credenciais:/home/jaiminho/.antigravity"
      # UNICO ponto de escrita do container na arvore do host. Diretorio neutro:
      # o que ele deixa aqui NAO entra no acervo sozinho — claudinho-TI confere e
      # chama `acervo-drop`. Sem bind na arvore de Books: container nao escreve
      # direto em fila de ingestao.
      - "${HOME}/AI/var/entrada-jaiminho:/saida:rw"
    # Rede default (bridge): alcanca a internet — auth/ops/wiki pela porta publica
    # e a API do Google. NAO alcanca 127.0.0.1 do host, logo nao alcanca o Valkey
    # da malha msg. Esse isolamento e o desenho, nao acidente (card 437).
    networks: [saida]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8022/estado',timeout=8)"]
      interval: 60s
      timeout: 10s
      retries: 3

  # O MCP DELE. Nosso codigo, contexto de build proprio, contêiner separado: o
  # `ops-server` e o MCP das cadeiras e nao serve externo. Nao publica porta e nao
  # entra no tunel — quem chama e a ponte do contêiner vizinho, por `saida`.
  jaiminho-server:
    build: ../jaiminho-server
    image: platafirma/jaiminho-server:local
    container_name: jaiminho-server
    restart: unless-stopped
    env_file: [../jaiminho-server/.env]
    environment:
      # Mesmo motor que o wiki-mcp chama, pelo mesmo alias de rede.
      RAG_API_URL: "http://rag-api:8000"
      OIDC_ISSUER: "https://auth.platafirma.org/realms/platafirma"
      # JWKS pelo alias INTERNO do realm, na mesma rede: a borda do Cloudflare
      # devolve 1010 para User-Agent de biblioteca, e PyJWKClient e urllib. O
      # ops-server ja resolve isso indo em 127.0.0.1:8180; aqui o equivalente e
      # o alias `keycloak`. `iss` do token continua sendo o publico, e por isso
      # OIDC_ISSUER nao muda.
      OIDC_JWKS_URL: "http://keycloak:8080/realms/platafirma/protocol/openid-connect/certs"
      OIDC_AUDIENCE: "ops-mcp"
      PDP_DIR: "/opt/pf/politica-acesso"
      JAIMINHO_LOG_DIR: "/var/log/jaiminho"
      # Wiki: mesmo alias de rede que o `rag-api`, pela rede `wiki`. O segredo do
      # wiki-mcp para AQUI — ele nao tem PEP, e quem o carrega tem edit_page e
      # upload_file junto. O externo alcanca a wiki so pelas tools `wiki_*` deste
      # servidor, que passam pelo PDP e recortam o namespace.
      # O TOKEN nao entra aqui: `environment` vence `env_file`, e `${WIKI_MCP_TOKEN}`
      # interpola do .env DO PROJETO (jaiminho/), nao do env_file do servico — a
      # linha resolveria vazio e apagaria o valor que veio de jaiminho-server/.env.
      # Medido: health saiu "sem token" com a linha presente. Segredo mora so no
      # env_file; aqui fica o que nao e segredo.
      WIKI_MCP_URL: "http://mcp:8000/mcp"
    volumes:
      # PAP e PDP por bind READ-ONLY: merge no PAP vale sem rebuild, e o processo
      # nao tem como reescrever a regra que o prende.
      - "${HOME}/AI/platafirma-harness/politica-acesso:/opt/pf/politica-acesso:ro"
      # O bind nasce dono do root do namespace (= claudinho no host) e o processo
      # roda como 10001: sem converter a posse, `_audit` cai no fallback de stderr
      # e a trilha do externo so vive no `docker logs`. Converter, uma vez por
      # ambiente, de DENTRO do namespace — no host o chown exigiria CAP_CHOWN:
      #   docker run --rm -v "$HOME/AI/var/log/jaiminho:/x" --user 0:0 \
      #     platafirma/jaiminho-server:local chown -R 10001:999 /x
      - "${HOME}/AI/var/log/jaiminho:/var/log/jaiminho:rw"
    networks:
      # `saida`: e por onde a ponte dele chega aqui.
      # `wiki`: e onde o alias `rag-api` resolve — a mesma rede que o wiki-mcp usa
      # para falar com o motor.
      - saida
      - wiki
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=8)"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  saida:
    driver: bridge
  wiki:
    external: true
    name: plataforma-wiki_default

volumes:
  casa:
  credenciais:
