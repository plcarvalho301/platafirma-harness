name: jaiminho

services:
  # O BRACO `jaiminho` SAIU DAQUI EM 20/08/2026 (card #2286). Ele roda no daemon
  # rootless da conta `jaiminho` (uid 1003), com deploy em /srv/pf/agy/jaiminho e
  # fonte versionada em `platafirma-harness/migracao-2286/jaiminho/`.
  #
  # O servico NAO fica aqui comentado por nostalgia: enquanto ele existisse neste
  # arquivo, um `docker compose up -d` nesta pasta subiria um SEGUNDO braco no
  # daemon do claudinho, contra os volumes velhos — dois bracos vivos com a mesma
  # credencial e estados divergentes. Retirado por isso, a pedido de
  # claudinho-seguranca (handoff 20260820T195257), e nao por arrumacao.
  #
  # O que sobra nesta stack e o MCP, que NAO migrou e segue no daemon do claudinho.

  # O MCP DELE. Nosso codigo, contexto de build proprio, contêiner separado: o
  # `ops-server` e o MCP das cadeiras e nao serve externo. Nao publica porta e nao
  # entra no tunel — quem chama e a ponte do contêiner vizinho, por `saida`.
  jaiminho-server:
    build: ../jaiminho-server
    image: platafirma/jaiminho-server:local
    container_name: jaiminho-server
    restart: unless-stopped
    env_file: [../jaiminho-server/.env]
    # PORTA PUBLICADA — NAO SUBIR SEM OS DOIS SIGN-OFFS (card #2380).
    #
    # Por que ela existe: com o card #2286 os dois bracos do `agy` passaram ao daemon
    # rootless da conta `jaiminho` (uid 1003). O alias de rede `jaiminho-server`, que
    # servia o acervo a fabrica, morreu com a mudanca de daemon — a regra
    # `fabrica-le-acervo-firma` do PAP segue VALIDA: falta endereco, nao autorizacao.
    #
    # Por que no IP da LAN e nao em 127.0.0.1: o rootlesskit do 1003 sobe com
    # `--disable-host-loopback`. Loopback do host NAO e alcancavel de dentro daqueles
    # conteineres; interface real e. 192.168.15.17 e o endereco de `enp6s0`.
    #
    # O que protege a porta NAO e a rede, e o PEP: toda rota exige JWT do realm com
    # `aud=ops-mcp` e decide por sujeito contra o PAP. Sem token, 401. Foi essa a base
    # da posicao favoravel de claudinho-seguranca (handoff 20260820T195257, item 5).
    ports: ["192.168.15.17:8023:8000"]
    environment:
      # Mesmo motor que o wiki-mcp chama, pelo mesmo alias de rede.
      RAG_API_URL: "http://rag-api:8000"
      OIDC_ISSUER: "https://auth.platafirma.org/realms/platafirma"
      # JWKS pelo alias INTERNO do realm, na mesma rede: a borda do Cloudflare
      # devolve 1010 para User-Agent de biblioteca, e PyJWKClient e urllib. O
      # ops-server ja resolve isso indo em 127.0.0.1:8180; aqui o equivalente e
      # o alias `keycloak`. `iss` do token continua sendo o publico, e por isso
      # OIDC_ISSUER nao muda.
      OIDC_JWKS_URL: "http://keycloak:8080/realms/platafirma/protocol/openid-connect/certs"
      OIDC_AUDIENCE: "ops-mcp"
      # A protecao de DNS rebinding do MCP recusa Host fora desta lista com 421 —
      # medido em 20/08/2026 batendo em 192.168.15.17:8023 com e sem token: 421 nos
      # dois, antes de qualquer decisao de acesso. Publicar a porta sem nomear o host
      # aqui entrega uma porta que responde `health` e recusa toda chamada de MCP.
      # O endereco novo entra SEM tirar os antigos: o alias interno segue servindo o
      # wiki-mcp e o braco osint, que nao migraram.
      HOSTS_PERMITIDOS: "jaiminho-server:8000,jaiminho-server,127.0.0.1:8000,localhost:8000,192.168.15.17:8023,192.168.15.17"
      PDP_DIR: "/opt/pf/politica-acesso"
      JAIMINHO_LOG_DIR: "/var/log/jaiminho"
      # Wiki: mesmo alias de rede que o `rag-api`, pela rede `wiki`. O segredo do
      # wiki-mcp para AQUI — ele nao tem PEP, e quem o carrega tem edit_page e
      # upload_file junto. O externo alcanca a wiki so pelas tools `wiki_*` deste
      # servidor, que passam pelo PDP e recortam o namespace.
      # O TOKEN nao entra aqui: `environment` vence `env_file`, e `${WIKI_MCP_TOKEN}`
      # interpola do .env DO PROJETO (jaiminho/), nao do env_file do servico — a
      # linha resolveria vazio e apagaria o valor que veio de jaiminho-server/.env.
      # Medido: health saiu "sem token" com a linha presente. Segredo mora so no
      # env_file; aqui fica o que nao e segredo.
      WIKI_MCP_URL: "http://mcp:8000/mcp"
      # Drive: area de transferencia de mao unica com o dono. O ID da pasta e
      # config, nao segredo; o token e segredo e vem por bind read-only abaixo.
      GDRIVE_PASTA: "1oFQgrkpoVHikOlV6gJqH8nGgzDwAtqVz"
      GOOGLE_TOKEN: "/opt/pf/google/token.json"
    volumes:
      # PAP e PDP por bind READ-ONLY: merge no PAP vale sem rebuild, e o processo
      # nao tem como reescrever a regra que o prende.
      - "${HOME}/AI/platafirma-harness/politica-acesso:/opt/pf/politica-acesso:ro"
      # O bind nasce dono do root do namespace (= claudinho no host) e o processo
      # roda como 10001: sem converter a posse, `_audit` cai no fallback de stderr
      # e a trilha do externo so vive no `docker logs`. Converter, uma vez por
      # ambiente, de DENTRO do namespace — no host o chown exigiria CAP_CHOWN:
      #   docker run --rm -v "$HOME/AI/var/log/jaiminho:/x" --user 0:0 \
      #     platafirma/jaiminho-server:local chown -R 10001:999 /x
      # Credencial do Google READ-ONLY e fora da imagem, pelo mesmo motivo do PAP:
      # rotacionar o refresh token nao pode exigir rebuild, e o processo nao tem
      # como reescrever a credencial que o prende. Modo 600 no host, uid 10001 le
      # porque o bind entra como o dono do namespace.
      - "${HOME}/AI/var/google/token.json:/opt/pf/google/token.json:ro"
      - "${HOME}/AI/var/log/jaiminho:/var/log/jaiminho:rw"
    networks:
      # `saida`: e por onde a ponte dele chega aqui.
      # `wiki`: e onde o alias `rag-api` resolve — a mesma rede que o wiki-mcp usa
      # para falar com o motor.
      - saida
      - wiki
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=8)"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  saida:
    driver: bridge
  wiki:
    external: true
    name: plataforma-wiki_default

volumes:
  casa:
  credenciais:
