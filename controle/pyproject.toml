[project]
name = "harness-controle"
version = "0.1.0"
description = "Plano de controle do harness — agregador de estado e tela (card #390)."
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.47",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.5", "redis>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_controle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
