# Só a TELA roda em container. O agregador roda no host (systemd --user,
# controle/systemd/), e os dois se falam por um arquivo de estado.
#
# A divisão não é gosto, é o que os dois lados exigem:
# - o agregador chama os verbos, e verbo assume o host inteiro — systemctl, free,
#   git, docker CLI e o venv com shebang absoluto. Em container isso vira uma
#   caçada a dependência sem fim: medido, 5 dos 8 blocos ficavam indisponíveis.
# - a tela precisa estar na rede do gate, porque em docker rootless o host NÃO é
#   alcançável de dentro do container (host-gateway, 10.0.2.2 e o gateway da
#   bridge: os três medidos, os três mudos). Tela no host = 502 no oauth2-proxy.
#
# A tela só lê o arquivo, e o monta somente-leitura: ela não chama verbo para
# renderizar — isso já era exigência 4 da spec, agora é também topologia.
name: harness-controle

services:
  tela:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "harness_controle.web:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PF_RAIZ: /home/claudinho/AI
      AGREGADOR_ESTADO_PATH: /estado/estado.json
      PF_CADEIRA_TELA: claudinho-TI
      # HOME no container nao e /home/claudinho: sem isto o verbo procura
      # .personas em ~/AI/fila e nao acha. Antes isso desligava a validacao
      # em silencio; hoje e erro duro, mas o caminho certo e apontar.
      FILA_RAIZ: /home/claudinho/AI/fila
      DOCKER_HOST: unix:///run/user/1001/docker.sock
      FILA_REDIS_HOST: ${FILA_REDIS_HOST:-motor-msg}
      FILA_REDIS_PORT: ${FILA_REDIS_PORT:-6379}
    volumes:
      # Este mount NAO serve mais pro front (card #476: pf-ui.css, pf-ui.js e as
      # fontes vem COPIADOS pra dentro da imagem, arq:0056, e TOKENS_CSS_PATH
      # morreu junto). Ele continua porque o resto da tela ainda depende dele:
      # PF_RAIZ e FILA_RAIZ apontam pra ca, os verbos que as duas acoes chamam
      # sao ~/AI/platafirma-harness/bin/{fila_streams.py,infra}, e /feito roda
      # `git log` no clone. Remover isto quebraria acao e leitura, nao estilo.
      - /home/claudinho/AI:/home/claudinho/AI:ro
      - /run/user/1001/docker.sock:/run/user/1001/docker.sock
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - /run/user/1001:/run/user/1001
      - /home/claudinho/AI/var/run/harness-controle:/estado:ro
    ports:
      - "127.0.0.1:${HARNESS_CONTROLE_PORTA:-8091}:8000"
    networks: [conhecimento, msg]


networks:
  # Onde o oauth2-proxy-harness vive: o gate alcanca "tela:8000" por nome.
  # Em docker rootless o host NAO e alcancavel de dentro do container
  # (host-gateway, 10.0.2.2 e o gateway da bridge, todos medidos, todos mudos),
  # entao a tela precisa estar na mesma rede do gate — nao ha atalho pelo host.
  conhecimento:
    external: true
    name: plataforma-wiki_default
  # Malha do Valkey: "fila enviar" da acao "despachar recado" alcanca motor-msg por nome.
  msg:
    external: true
    name: motor_malha
