name: controle — testes

on:
  push:
    paths:
      - "controle/**"
      - ".github/workflows/controle-tests.yml"
  pull_request:
    paths:
      - "controle/**"
      - ".github/workflows/controle-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controle
    steps:
      - uses: actions/checkout@v4

      - name: instala uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: sincroniza dependencias declaradas (pyproject.toml + uv.lock)
        run: uv sync --locked --group dev

      # BASELINE VERDE, e nao `tests/` inteiro. A suite completa tem 11 falhas e 3 erros
      # de coleta hoje (medido 18/08): CI que nasce vermelho e CI que todo mundo aprende
      # a ignorar em uma semana. Roda o que `tests/VERDES` lista — mesma lista do
      # hooks/pre-push, uma fonte so — e arquivo consertado entra na lista no commit que
      # o conserta. A lista so cresce, e o dia em que ela cobrir tudo, isto vira `tests/`.
      # So as entradas da subarvore controle/ (tests/...). As de testes/ da raiz (card #3326)
      # precisam do venv harness do host (redis e o resto do venvs/harness/uv.lock), que este
      # job nao tem: aqui o venv e o do projeto controle. Quem as mede e o pre-push e o gate de
      # promocao, pelo `teste rodar platafirma-harness --portao`.
      - name: suite de controle (baseline verde; modelo em controle/tests/MODELO-SUITE.md)
        run: |
          # a linha pode trazer o raio depois de `|` (card #3370): aqui so o arquivo, a lista inteira roda
          arquivos=$(grep -v '^\s*#' tests/VERDES | grep -v '^\s*$' | sed 's/[[:space:]]*|.*$//' | grep -v '^testes/' | tr '\n' ' ')
          echo "baseline: $arquivos"
          uv run pytest $arquivos -q
