name: controle — testes

on:
  push:
    paths:
      - "controle/**"
      - ".github/workflows/controle-tests.yml"
  pull_request:
    paths:
      - "controle/**"
      - ".github/workflows/controle-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controle
    steps:
      - uses: actions/checkout@v4

      - name: instala uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: sincroniza dependencias declaradas (pyproject.toml + uv.lock)
        run: uv sync --locked --group dev

      - name: suite de controle (modelo em controle/tests/MODELO-SUITE.md)
        run: uv run pytest tests/ -q
